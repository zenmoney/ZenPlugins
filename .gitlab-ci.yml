image: node:24.21.0

variables:
  SHARED_CACHE_ROOT: /opt/plugins-cache
  WEBPACK_CACHE_DIR: .webpack-cache
  PLUGINS_SCRIPTS_DIR: /opt/plugins/scripts

before_script:
  - scripts/setupDependenciesCache.sh

stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - yarn test

build:
  stage: build
  script:
    - 'node "$PLUGINS_SCRIPTS_DIR/build.ts"'
  artifacts:
    paths:
      - build/
    expire_in: 7 days
  only:
    - master
    - develop
    - /^[^/]+_beta$/

deploy:
  stage: deploy
  before_script: []
  needs:
    - job: build
      artifacts: true
  resource_group: plugins-dist
  script:
    - 'node "$PLUGINS_SCRIPTS_DIR/deploy.ts"'
  only:
    - master
    - develop
    - /^[^/]+_beta$/
