name: Sberbank recovery build

on:
  push:
    branches:
      - recovery/sberbank-online
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build Sberbank plugin
        run: yarn build sberbank-online
      - name: Run historical conversion tests
        run: yarn jest src/plugins/sberbank-online/converters.test.js --runInBand
