name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.21.0'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run tests
      run: yarn test
